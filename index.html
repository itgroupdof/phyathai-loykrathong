<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ลอยกระทงออนไลน์ | โรงพยาบาลพญาไท ๒ สนามเป้า</title>
  <meta name="description" content="ร่วมลอยกระทงออนไลน์กับโรงพยาบาลพญาไท ๒ สนามเป้า เพื่อสิ่งแวดล้อม ลดขยะสู่ธรรมชาติ ๑๐๐%">
  <meta name="theme-color" content="#0a1628">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Stars Background -->
<div class="stars-container" id="starsContainer"></div>

<!-- Moon -->
<div class="moon">
  <div class="moon-glow"></div>
  <div class="moon-surface"></div>
  <div class="moon-crater c1"></div>
  <div class="moon-crater c2"></div>
  <div class="moon-crater c3"></div>
</div>

<!-- Lanterns floating -->
<div class="lanterns-container" id="lanternsContainer"></div>

<!-- Header -->
<header class="site-header">
  <div class="header-content">
    <div class="logo-wrap">
      <img src="phyathai2-logo.png" alt="โรงพยาบาลพญาไท ๒" class="hospital-logo" id="hospitalLogo">
    </div>
    <div class="header-title">
      <span class="title-main">วันลอยกระทง ๒๕๖๙</span>
      <span class="title-sub">ลอยทุกข์ ลอยโศก รักษ์โลก รักษ์น้ำ</span>
    </div>
    <button class="btn-wishes-wall" onclick="openWishesWall()">
      <span>🏮</span> กระทงทั้งหมด
    </button>
  </div>
</header>

<!-- Eco Badge -->
<div class="eco-badge">
  <span class="eco-icon">🌿</span>
  <span class="eco-text">กระทงอิเล็กทรอนิกส์ ลดขยะสู่ธรรมชาติ <strong>๑๐๐%</strong></span>
</div>

<!-- Main Scene -->
<main class="main-scene">

  <!-- River Scene -->
  <div class="river-scene">
    <!-- Water surface -->
    <div class="water-surface">
      <div class="water-shimmer"></div>
      <div class="water-ripple r1"></div>
      <div class="water-ripple r2"></div>
      <div class="water-ripple r3"></div>
      <!-- Community krathongs on water -->
      <div class="community-krathongs" id="communityKrathongs"></div>
    </div>
  </div>

  <!-- Center Stage -->
  <div class="center-stage">

    <!-- Krathong Type Selector (top thumbnails) -->
    <div class="type-selector" id="typeSelector">
      <!-- filled by JS -->
    </div>

    <!-- Main Krathong Card -->
    <div class="krathong-card" id="krathongCard">

      <!-- SVG Krathong Art -->
      <div class="krathong-art-wrap" id="krathongArtWrap">
        <div class="krathong-water-reflection" id="krathongReflection"></div>
        <div class="krathong-art" id="krathongArt">
          <!-- filled by JS -->
        </div>
        <div class="krathong-label-name" id="krathongTypeName">บัวสวรรค์สุขภาพดี</div>
      </div>

      <!-- Form Overlay ON the krathong -->
      <div class="form-overlay" id="formOverlay">
        <div class="form-inner">
          <div class="form-field">
            <label class="field-label">✨ ชื่อของคุณ</label>
            <input type="text" id="inputName" class="field-input" placeholder="กรอกชื่อ-นามสกุล" maxlength="50">
          </div>
          <div class="form-field">
            <label class="field-label">🙏 คำอธิษฐาน</label>
            <textarea id="inputWish" class="field-textarea" placeholder="ขอให้สุขภาพแข็งแรง มีความสุข..." maxlength="120" rows="3"></textarea>
          </div>
          <div class="form-field">
            <label class="field-label">📍 สถานที่ลอยกระทง</label>
            <select id="inputLocation" class="field-select">
              <option value="chaophraya">🌊 แม่น้ำเจ้าพระยา กรุงเทพฯ</option>
              <option value="sukhothai">🏯 อุทยานประวัติศาสตร์สุโขทัย</option>
              <option value="chiangmai">🏔️ แม่น้ำปิง เชียงใหม่</option>
              <option value="ayutthaya">⛩️ วัดพนัญเชิง อยุธยา</option>
              <option value="phuket">🌺 สะพานหิน ภูเก็ต</option>
            </select>
          </div>
          <button class="btn-float" id="btnFloat" onclick="floatKrathong()">
            <span class="btn-icon">🪷</span>
            <span class="btn-text">ลอยกระทง</span>
          </button>
        </div>
      </div>

    </div><!-- /krathong-card -->

    <!-- Char counter -->
    <div class="char-counter" id="charCounter">คำอธิษฐาน <span id="charCount">0</span>/120 ตัวอักษร</div>

  </div><!-- /center-stage -->

</main>

<!-- Float Animation Overlay -->
<div class="float-overlay" id="floatOverlay">
  <div class="float-krathong-animate" id="floatAnimate">
    <div class="float-art" id="floatArt"></div>
  </div>
  <div class="float-message" id="floatMessage">
    <div class="float-msg-icon">🙏</div>
    <div class="float-msg-name" id="floatMsgName"></div>
    <div class="float-msg-wish" id="floatMsgWish"></div>
    <div class="float-msg-eco">🌿 กระทงของคุณปลอดภัยต่อธรรมชาติ ๑๐๐%</div>
    <div class="float-msg-buttons">
      <button class="btn-save" onclick="saveCard()">📸 บันทึกการ์ด</button>
      <button class="btn-new" onclick="resetForm()">🪷 ลอยกระทงใหม่</button>
    </div>
  </div>
  <!-- Particles -->
  <div class="particles-container" id="particlesContainer"></div>
</div>

<!-- Wishes Wall Modal -->
<div class="modal-overlay" id="wishesModal" onclick="closeWishesWall(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">🏮 กระทงทั้งหมด</h2>
      <button class="modal-close" onclick="closeWishesWall()">✕</button>
    </div>
    <div class="modal-body" id="wishesModalBody">
      <div class="loading-wishes">กำลังโหลด...</div>
    </div>
  </div>
</div>

<!-- Hidden canvas for card save -->
<canvas id="saveCanvas" style="display:none"></canvas>

<!-- Audio -->
<audio id="bgMusic" loop>
  <!-- Web Audio API fallback -->
</audio>

<div class="audio-btn" id="audioBtn" onclick="toggleAudio()">
  <span id="audioIcon">🔇</span>
</div>

<!-- Stat counter bottom -->
<div class="stat-bar">
  <div class="stat-item">
    <span class="stat-num" id="statCount">0</span>
    <span class="stat-label">กระทงที่ลอยแล้ว</span>
  </div>
  <div class="stat-divider">|</div>
  <div class="stat-item">
    <span class="stat-num">๑๐๐%</span>
    <span class="stat-label">ลดขยะสู่แม่น้ำ</span>
  </div>
  <div class="stat-divider">|</div>
  <div class="stat-item">
    <span class="stat-num">๒๕๖๙</span>
    <span class="stat-label">ปีพุทธศักราช</span>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="script.js"></script>
</body>
</html>
